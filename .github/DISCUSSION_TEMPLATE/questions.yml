labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        ![Questions about MEDomicsLab and its projects](https://github.com/MEDomicsLab/community/blob/main/assets/discussions/general/questions/questions.png?raw=true&v=20261111-2)
  - type: dropdown
    id: project
    attributes:
      label: Scope
      options:
        - MEDomicsLab
        - MEDiml
        - MED3pa
        - MEDfl
        - MEDProfiles
        - Other
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: What is your question?
      description: Describe what you are trying to do and where you got stuck.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: What have you tried?
      description: Include the version, relevant documentation, or steps you have already taken, if applicable.
