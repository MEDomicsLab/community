  - type: markdown
    attributes:
      value: |
        ### 4. DataManager: radiomics pre-checks

        Selecting the dataset, ROI definitions and output folders, then running and interpreting the pre-checks.

        [Guide for this step ↗](https://medomicslab.gitbook.io/mediml-app-docs/soft-tissue-sarcoma-poc/2.-datamanager-radiomics-pre-checks)
