title: "[MEDiml review] Automatic name detection (do not edit)"
labels: [proof-of-concept, mediml, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        ![MEDiml Proof of Concept Review](https://github.com/MEDomicsLab/community/blob/main/assets/discussions/proof-of-concept/mediml-reviews/mediml-review.png?raw=true&v=20261111-2)

        Allo! ⚜️ Thanks for testing MEDiml. Please rate each step you tried and explain what made it easy or difficult. If you got blocked, tell us where you stopped and choose **Not attempted** for the steps you did not reach.

        > [!IMPORTANT]
        > ### [Open the study guide ↗](https://medomicslab.gitbook.io/mediml-app-docs/soft-tissue-sarcoma-poc)
        > The Soft Tissue Sarcoma proof of concept, step by step. Follow it while you test, and keep it open next to the app. Each step below also links to its own part of the guide.
        >
        > ### Worth knowing before you start
        >
        > - **Screenshots are strongly recommended.** You can paste or drag images straight into any text box below.
        > - **Full logs are strongly recommended.** Drag the saved log file into the relevant text box. To paste the log as text instead, wrap it in `<details><summary>Log</summary>` and `</details>` so it stays collapsed.
        > - **Remove personal information** before you post. Logs and screenshots can show your username in file paths.

        If you found a reproducible bug, open an issue in the affected project and paste its link in the relevant step below. Leave the bug field blank if there was no bug. [MEDiml-app issues ↗](https://github.com/MEDomicsLab/MEDiml-app/issues) · [MEDiml-pkg issues ↗](https://github.com/MEDomicsLab/MEDiml-pkg/issues)
  - type: input
    id: round
    attributes:
      label: "Study round"
      description: "Use the round name from the briefing."
      value: "Soft Tissue Sarcoma"
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ### Versions and environment
  - type: input
    id: app_version
    attributes:
      label: "MEDiml-app version"
      description: "Shown on the app's home page."
      placeholder: "e.g. v1.0.0"
    validations:
      required: true
  - type: dropdown
    id: operating_system
    attributes:
      label: "Operating system"
      multiple: false
      options:
        - "Windows"
        - "macOS"
        - "Linux"
    validations:
      required: true
  - type: input
    id: os_version
    attributes:
      label: "Operating system version (optional)"
      placeholder: "e.g. Windows 11 23H2, macOS 15.1, Ubuntu 24.04"
    validations:
      required: false
  - type: input
    id: ram
    attributes:
      label: "RAM (optional)"
      placeholder: "e.g. 16 GB"
    validations:
      required: false
  - type: input
    id: cpu
    attributes:
      label: "CPU (optional)"
    validations:
      required: false
  - type: input
    id: pkg_version
    attributes:
      label: "MEDiml-pkg version (optional)"
      description: "Only if you tested the package directly."
    validations:
      required: false
  - type: input
    id: python_version
    attributes:
      label: "Python version (optional)"
      description: "Only if you tested the package directly."
    validations:
      required: false
  - type: dropdown
    id: dataset
    attributes:
      label: "Dataset used"
      multiple: false
      options:
        - "Light (10 patients)"
        - "Full (51 patients)"
        - "Both Light and Full"
        - "Could not download the dataset"
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ### 1. Installation

        Downloading the installer, installing MEDiml-app, and opening it for the first time.

        [Guide for this step ↗](https://medomicslab.gitbook.io/mediml-app-docs/quick-start)
  - type: dropdown
    id: installation_difficulty
    attributes:
      label: "Installation difficulty"
      description: "Rate the effort needed to complete this step. If you tried but got blocked, rate your experience and explain where you stopped below."
      multiple: false
      options:
        - "1 - Very easy"
        - "2 - Easy"
        - "3 - Moderate"
        - "4 - Difficult"
        - "5 - Very difficult"
        - "Not attempted"
    validations:
      required: true
  - type: textarea
    id: installation_feedback
    attributes:
      label: "Installation feedback"
      description: "Explain your rating. What worked, what was confusing, and where did you stop if you could not finish? Leave blank if you did not attempt this step."
  - type: textarea
    id: installation_ui_ux
    attributes:
      label: "Installation UI and UX (optional)"
      description: "Installer instructions, first-launch messages, setup progress, and whether you knew the app was ready."
      placeholder: |
        UI (labels, layout, controls, or plots):

        UX (navigation, instructions, progress, or recovery from an error):
    validations:
      required: false
  - type: textarea
    id: installation_bugs
    attributes:
      label: "Installation bug reports"
      description: "Issue link(s), if any."
  - type: markdown
    attributes:
      value: |
        ### 2. Workspace and dataset download

        Choosing a workspace and downloading the Light or Full dataset from the app.

        [Guide for this step ↗](https://medomicslab.gitbook.io/mediml-app-docs/soft-tissue-sarcoma-poc)
  - type: dropdown
    id: dataset_difficulty
    attributes:
      label: "Workspace and dataset download difficulty"
      description: "Rate the effort needed to complete this step. If you tried but got blocked, rate your experience and explain where you stopped below."
      multiple: false
      options:
        - "1 - Very easy"
        - "2 - Easy"
        - "3 - Moderate"
        - "4 - Difficult"
        - "5 - Very difficult"
        - "Not attempted"
    validations:
      required: true
  - type: textarea
    id: dataset_feedback
    attributes:
