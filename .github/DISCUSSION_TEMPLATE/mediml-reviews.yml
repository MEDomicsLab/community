    attributes:
      label: "6.1 Scene 1 UI and UX (optional)"
      description: "Downloading and placing the feature sets, importing the scene, updating file paths, configuring nodes, following training progress, and comparing the four pipelines."
      placeholder: |
        UI (labels, layout, controls, or plots):

        UX (navigation, instructions, progress, or recovery from an error):
