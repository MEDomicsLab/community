    attributes:
      label: "6.2 Scene 2 UI and UX (optional)"
      description: "Importing the scene, updating file paths, configuring the Design and Data nodes, following training progress, and comparing the three feature families."
      placeholder: |
        UI (labels, layout, controls, or plots):

        UX (navigation, instructions, progress, or recovery from an error):
    validations:
      required: false
  - type: textarea
    id: learning_scene2_bugs
    attributes:
      label: "6.2 Scene 2 bug reports"
      description: "Issue link(s), if any."
  - type: markdown
    attributes:
      value: |
        #### 6.3 Scene 3: Comparing learning algorithms

        Importing or building the `STS_Algorithms_Analysis` scene, configuring it to compare Logistic Regression, XGBoost and the automated Best Model on the feature family chosen in Scene 2, running it and choosing the final model.

        [Guide for this part ↗](https://medomicslab.gitbook.io/mediml-app-docs/soft-tissue-sarcoma-poc/4.-learning-module#scene-3-comparing-learning-algorithms)
  - type: dropdown
