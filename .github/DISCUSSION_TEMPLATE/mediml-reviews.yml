      required: false
  - type: textarea
    id: learning_scene1_bugs
    attributes:
      label: "6.1 Scene 1 bug reports"
      description: "Issue link(s), if any."
  - type: markdown
    attributes:
      value: |
        #### 6.2 Scene 2: Which feature family performs best?

        Importing or building the `STS_Complexity_Analysis` scene, configuring it for the morphological, intensity and texture features of the best modality from Scene 1, running it and comparing the three feature families.

        [Guide for this part ↗](https://medomicslab.gitbook.io/mediml-app-docs/soft-tissue-sarcoma-poc/4.-learning-module#scene-2-which-feature-family-performs-best)
  - type: dropdown
