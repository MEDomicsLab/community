      description: "Issue link(s), if any."
  - type: markdown
    attributes:
      value: |
        ### 6. Learning Module

        Training and comparing models in three scenes, then finalizing the chosen model. Rate each part below.

        [Guide for this step ↗](https://medomicslab.gitbook.io/mediml-app-docs/soft-tissue-sarcoma-poc/4.-learning-module)
  - type: markdown
    attributes:
      value: |
        #### 6.1 Scene 1: Which imaging modality performs best?

        Downloading the Full POC feature sets, then importing or building the `STS_Modalities_Eval` scene, configuring it, running the four modality pipelines (CT, PET, T1, T2FS) and comparing their results.

        [Guide for this part ↗](https://medomicslab.gitbook.io/mediml-app-docs/soft-tissue-sarcoma-poc/4.-learning-module#scene-1-which-imaging-modality-performs-best)
  - type: dropdown
    id: learning_scene1_difficulty
    attributes:
      label: "6.1 Scene 1 difficulty"
      description: "Rate the effort needed to complete this step. If you tried but got blocked, rate your experience and explain where you stopped below."
      multiple: false
      options:
        - "1 - Very easy"
        - "2 - Easy"
        - "3 - Moderate"
        - "4 - Difficult"
        - "5 - Very difficult"
        - "Not attempted"
    validations:
      required: true
  - type: textarea
    id: learning_scene1_feedback
    attributes:
